name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'Marbles/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows.yml'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full source and large 3MF files
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify downloaded LFS assets
        run: git lfs pull
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify assets and HTTP server
        run: npm run check
      - name: Build Windows installer and portable executable
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload unsigned Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: Marble-Run-Maker-Windows
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: error
          retention-days: 14
