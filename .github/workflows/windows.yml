name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'Marbles/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/windows.yml'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full project (including Git LFS files)
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Retrieve Git LFS 3MF model files
        shell: pwsh
        run: |
          git lfs pull
          if ($LASTEXITCODE -ne 0) { throw 'Git LFS pull failed. Confirm your account has sufficient LFS quota.' }
      - name: Confirm the complete website was uploaded
        shell: pwsh
        run: |
          if (-not (Test-Path 'Marbles/index.html')) {
            throw 'Marbles/index.html is missing! Upload the website and models using scripts/publish-to-github.ps1 from the complete project ZIP before building.'
          }
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path 'package-lock.json') {
            npm ci --no-audit --no-fund
          } else {
            npm install --no-audit --no-fund
          }
          if ($LASTEXITCODE -ne 0) { throw 'npm dependency installation failed' }
      - name: Verify assets and HTTP server
        run: npm run check
      - name: Build offline Windows installer and portable executable
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify both executables and bundled assets
        run: node scripts/verify-windows-build.cjs
      - name: Upload unsigned Windows executables and SHA256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: Marble-Run-Maker-Windows
          path: |
            dist/Marble-Run-Maker-Setup-*.exe
            dist/Marble-Run-Maker-Portable-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
