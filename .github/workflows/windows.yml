name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'Marbles/**'
      - 'marbles/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - '.github/workflows/windows.yml'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full project (including Git LFS files)
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Retrieve Git LFS 3MF model files
        shell: pwsh
        run: |
          git lfs pull
          if ($LASTEXITCODE -ne 0) { throw 'Git LFS pull failed. Confirm your account has sufficient LFS quota.' }
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize uploaded website folder (Marbles or marbles)
        run: node scripts/prepare-site.cjs
      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path 'package-lock.json') {
            npm ci --no-audit --no-fund
          } else {
            npm install --no-audit --no-fund
          }
          if ($LASTEXITCODE -ne 0) { throw 'npm dependency installation failed' }
      - name: Verify assets and HTTP server
        run: npm run check
      - name: Build offline Windows installer and portable executable
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify both executables and bundled assets
        run: node scripts/verify-windows-build.cjs
      - name: Upload unsigned Windows executables and SHA256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: Marble-Run-Maker-Windows
          path: |
            dist/Marble-Run-Maker-Setup-*.exe
            dist/Marble-Run-Maker-Portable-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      # A release, unlike an artifact, never expires and needs no login to download, so
      # Generator Library can install and update the app from it. One release per run,
      # tagged desktop-v<version>.<run number>.
      - name: Read app version
        if: github.event_name != 'pull_request'
        shell: bash
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Publish Windows release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ env.APP_VERSION }}.${{ github.run_number }}
          name: Marble Run Maker Desktop v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: |
            dist/Marble-Run-Maker-Setup-*.exe
            dist/Marble-Run-Maker-Portable-*.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            Unsigned Windows installer and portable executable built from ${{ github.sha }}.
            Windows SmartScreen may warn until the application is code-signed; verify the SHA-256 checksums in SHA256SUMS.txt.
